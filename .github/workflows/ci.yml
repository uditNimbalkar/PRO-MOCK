name: CI - Frontend and Backend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test backend
        run: mvn -f backend/pom.xml test

  frontend:
    name: Frontend preview and screenshot
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Nuxt app
        working-directory: frontend
        run: npm run build

      - name: Start built Nuxt production server
        working-directory: frontend
        run: |
          npm run start > nuxt-start.log 2>&1 &
          npx wait-on http://127.0.0.1:3000

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture frontend screenshot
        run: |
          mkdir -p artifacts
          npx playwright screenshot --device="Desktop Chrome" http://127.0.0.1:3000 artifacts/frontend-home.png
          curl -I http://127.0.0.1:3000

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-home-screenshot
          path: artifacts/frontend-home.png
          if-no-files-found: error
